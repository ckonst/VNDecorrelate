[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vndecorrelate"
version = "1.1.0"
description = "A Velvet-Noise Decorrelator for audio"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Christian Konstantinov", email = "ckonst98@gmail.com" }
]

dependencies = [
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "pillow==12.3.0",
    "scipy==1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.12.1",
    "snakeviz>=2.2.2",
]

[tool.ruff]
exclude = [".venv"]
fix = true

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "single"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.hatch.build.targets.wheel]
packages = ["src/vndecorrelate"]